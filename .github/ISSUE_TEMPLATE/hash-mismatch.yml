name: Hash mismatch
description: Two runs of the same model and input produced different hashes.
title: "[mismatch] <model> on <device>"
labels: ["mismatch"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking. Please attach both logs (or at least their `ALL`
        values) and the exact verifier output so we can reproduce it.
  - type: input
    id: device
    attributes:
      label: Device (CPU / GPU)
      description: CPU model and thread count, GPU model and driver, or phone model.
      placeholder: "e.g. NVIDIA A10, driver 550.54; or Intel Xeon 8375C, 8 threads"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04, Windows 11 ARM64, Android 16"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and variant
      placeholder: "e.g. Qwen2.5-7B-Instruct, 4-bit (g)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The two log files, or their ALL values
      description: Drag and drop both logs here, or paste the `ALL` line of each and say which is the reference.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Verifier output
      description: Full output of `python3 -m idemcore_verify compare ...` (and `check` if relevant).
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: The exact command(s) you ran, including flags such as `--subset`.
      render: shell
    validations:
      required: true
