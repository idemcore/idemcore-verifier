name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    # Python 3.9 is not available on the newest ubuntu-latest image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Recompute every published hash (samples/)
        run: idemcore-verify samples
      - name: Unit tests
        run: python -m unittest discover -s tests -v
